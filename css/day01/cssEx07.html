<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 색</title>
    <style>
        @font-face {
            font-family: 'BithumbGothicOriginal';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2610082345@original/original/Bithumb Gothic Original.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
            font-style: italic;
        }

        h3 {
            font-family: 'BithumbGothicOriginal';
        }

        div {
            width: 400px;
            height: 100px;
            margin-left: 30px;
            margin-right: 30px;
            margin-bottom: 10px;
            color: white;
            text-align: center;
            line-height: 100px;
            font-family: 'BithumbGothicOriginal';
            font-size: 24px;
            font-weight: bold;
        }

    </style>
</head>

<body>
    <h3>CSS 색활용</h3>
    <hr>
    <div style="background-color: #00BFFF;">Deepskyblue (#00BFFF)</div>
    <div style="background-color: #A52A2A;">Brown (#A52A2A)</div>
    <div style="background-color: #FF00FF;">Fuchsia (#FF00FF)</div>
    <div style="background-color: #FF8C00;">Darkorange (#FF8C00)</div>
    <div style="background-color: #008B8B;">Darkcyan (#008B8B)</div>
    <div style="background-color: #6B8E23;">Olivedrab (#6B8E23)</div>
</body>


</html>
