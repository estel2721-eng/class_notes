<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 200px;
            height: 100px;
            margin: 50px;
            padding: 15px;
            border: 13px solid lightgray;
            background-image: url('./img/spongebob.png');
            background-repeat: no-repeat;
            background-size: 200px 150px;

        }

        .redBox {
            box-shadow: 20px 20px #f00;
        }

        .blueBox {
            box-shadow: 20px 20px 10px skyblue;
        }

        .multiBox {
            box-shadow: 2px 2px 2px #000, 
            0 0 25px #00f, 
            0 0 5px #2e0b70;
        }
    </style>
</head>

<body>
    <h3>박스 그림자</h3>
    <hr>
    <div class="redBox">뚱이와 함께</div>
    <div class="blueBox">뚱이와 함께</div>
    <div class="multiBox">뚱이와 함께</div>
</body>

</html>
