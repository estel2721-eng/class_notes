<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>둥근 모서리</title>
    <style>
        p {
            background: #fcf;
            text-align: center;
            line-height: 120px;
        }
        #r1 {border-radius: 80px;}
        #r2 {border-radius: 0 50px 70px 90px;}
        #r3 {border-radius: 0 50px 7px 50px;}
        #r4 {border-radius: 0 50px 0 50px;}
        #r5 {border-radius: 50px;}
    </style>
</head>
<body>
    <h3>둥근 모서리</h3>
    <hr>
    <p id="r1">반지름 80픽셀의 둥근 모서리</p>
    <p id="r2">반지름 0, 50, 70, 90픽셀의 둥근 모서리</p>
    <p id="r3">반지름 0, 50, 7, 50픽셀의 둥근 모서리</p>
    <p id="r4">반지름 0, 50, 0, 50픽셀의 둥근 모서리</p>
    <p id="r5">반지름 50픽셀의 둥근 모서리</p>
</body>
</html>
