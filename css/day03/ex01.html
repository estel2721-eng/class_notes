<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 설정</title>
    <style>
        div {
            /* width: 200px; */
            /* height: 120px; */
            background: #ccf;
            border: 3px solid rgb(99, 71, 179);
            color: rgb(22, 14, 128);
        }
    </style>
</head>
<body>
    <h3>인라인, 블록, 인라인블록</h3>
    <hr>
    <div style="display: none;">div(none)</div>
    <div style="display: inline;">div(inline)</div>
    <div style="display: inline-block;">div(inline-block)</div>
    <div style="display: block;">div(block)</div>
</body>
</html>
