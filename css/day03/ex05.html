    <title>float 배치</title>
    <style>
        #float {
            float: right;
            border: 1px solid #222;
            width: 10em;
            padding: 1em;
            background: #ffc;
        }
    </style>
</head>

<body>
    <h3>학기말고사</h3>
    <p id="float">12월 25일은 바이올린 홍길동의 크리스마스 특별 연주가 있습니다.</p>
    <p>이제 곧 겨울방학이 시작됩니다. 학기중 못다한 영어, 수학, 
        과학과목을 열심히 하시기 바랍니다.대입을 준비하는 수능생
        여러분들 노력에 더욱 정진하십시오.</p>
</body>

</html>
