<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index</title>
    <style>
        div {
            position: absolute;
        }
        div>img {
            border: 3px solid #ccf;
            border-radius: 10px;
            position: absolute;
            box-shadow: 3px 3px 3px #00000055;
        }
        #img1 {z-index: -3; left:10px; top: 20px}
        #img2 {z-index: 2; left:40px; top: 40px}
        #img3 {z-index: 3; left:80px; top: 60px}
        #img4 {z-index: 7; left:120px; top: 80px}
    </style>
</head>

<body>
    <h3>z-index</h3>
    <hr>
    <div>
        <img id="img1" src="./img1.jpg" width="120" height="140" alt="">
        <img id="img2" src="./img2.jpg" width="120" height="140" alt="">
        <img id="img3" src="./img3.png" width="120" height="140" alt="">
        <img id="img4" src="./img4.jpg" width="120" height="140" alt="">
    </div>
</body>

</html>
