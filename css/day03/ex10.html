<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 0 auto;
        }

        thead,
        tfoot {
            background: #ccf;
        }

        th,
        td {
            width: 100px;
            height: 15px;
            padding: 5px;
            text-align: left;
            border: 1px solid #333;
        }

        h3 {
            text-align: center;
        }
    </style>
</head>

<body>
    <h3>2026 IT 5기 성적표</h3>
    <table>
        <caption>2026 IT 5기 성적표</caption>
        <thead>
            <tr>
                <th>이름</th>
                <th>HTML</th>
                <th>CSS</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>가길동</td>
                <td>85</td>
                <td>90</td>
            </tr>
            <tr>
                <td>나길동</td>
                <td>80</td>
                <td>85</td>
            </tr>
            <tr>
                <td>다길동</td>
                <td>75</td>
                <td>80</td>
            </tr>
            <tr>
                <td>라길동</td>
                <td>70</td>
                <td>75</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>합계</th>
                <th>310</th>
                <th>315</th>
            </tr>
        </tfoot>
    </table>
</body>

</html>
