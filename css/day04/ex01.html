<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼 스타일</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #FF933E;
            padding: 20px;
        }

        label {
            display: flex;
            padding: 20px;
            background: #FFE9A9;
        }

        label span {
            width: 100px;
            display: block;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: 2px solid #F4BAA3;
            border: none;
            border-radius: 3px;
            font-size: 200%;
        }

        input[type="submit"] {
            width: fit-content;
            padding: 10px 40px;
            background: #FF933E;
            border: 2px solid #fd7004;
            border-radius: 4px;
            box-shadow: 2px 2px 3px #00000045;
        }

        input[type="submit"]:hover {
            box-shadow: 0px 0px 3px #00000025;
            font-size: 200%;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h3>Contact us</h3>
    <hr>
    <!-- 문의하기 폼 -->
    <form action="">
        <!-- 이름 -->
        <label for="">
            <span>Name</span>
            <input type="text" placeholder="홍길동">
        </label>

        <!-- 이메일 -->
        <label for="">
            <span>Email</span>
            <input type="email" placeholder="example@email.com">
        </label>

        <!-- 코멘트 -->
        <label for="">
            <span>Comment</span>
            <textarea name="" id="" cols="50" rows="10" placeholder="메세지를 입력해주세요"></textarea>
        </label>

        <!-- 전송버튼 -->
        <label for="">
            <span></span>
            <input type="submit" value="전송">
        </label>
    </form>
</body>

</html>
