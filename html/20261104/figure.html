<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>figure</title>
    <script>
        alert("좋은 아침입니다.")
    </script>
</head>
<body>
    <h3>figure</h3>
    <hr color="#ddd">
    <figure>
        <figcaption>alert 함수 활용</figcaption>
        <pre>
            <code>
                function f() {
                    alert("함수입니다.")
                }
            </code>
        </pre>
        <hr>
        <small>실행 결과</small>
        <pre>
            <img src="./media/alert.png" alt="실행 결과">
        </pre>
    </figure>
</body>
</html>
