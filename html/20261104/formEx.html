<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./event.css" type="text/css">
    <title>회원가입</title>
</head>

<body>
    <h1>회원가입</h1>
    <form action="" name="form1" id="join">
        <div id="input">
            <h3>아이디</h3>
            <input type="text" name="userid" id="input">

            <h3>비밀번호</h3>
            <input type="password" name="password" id="input">

            <h3>주민번호</h3>
            <input type="password" name="juminno" id="input">

            <h3>성별</h3>
            <label for=""><input type="radio" name="gender" id="" value="남자">남자</label>
            <label for=""><input type="radio" name="gender" id="" value="여자">여자</label>

            <h3>이메일</h3>
            <input type="email" name="email" id="input">

            <h3>URL</h3>
            <input type="url" name="url" id="input">

            <h3>취미</h3>
            <label for=""><input type="checkbox" name="hobby" value="축구" id="input">축구</label>
            <label for=""><input type="checkbox" name="hobby" value="농구" id="input">농구</label>
            <label for=""><input type="checkbox" name="hobby" value="야구" id="input">야구</label>

            <h3>직업</h3>
            <select name="job">
                <option>직업을 선택하세요.</option>
                <option value="프로그래머">프로그래머</option>
                <option value="웹퍼블리셔">웹퍼블리셔</option>
                <option value="웹디자이너">웹디자이너</option>
                <option value="기획자">기획자</option>
            </select>

            <br>
            <input type="submit" value="회원가입" class="myButton">
            <input type="reset" value="초기화" class="myButton">
        </div>
    </form>
</body>

</html>
