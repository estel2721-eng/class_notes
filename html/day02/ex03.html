<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>단락 나누기</title>
</head>

<body>
    <h3>2개의 단락으로 꾸미기</h3>
    <p>
        HTML 문서도 본문을 여러 단락으로
        나눌 수 있다. CSS 스타일을 사용하면
        단락 단위로 내어쓰기와 들여쓰기가 가능함
    </p>
    <hr>
    <p>hr 태그는 가로로 선을 나타내는 태그임</p>
    <p>
        &lt;
        &nbsp;
        &gt;
    </p>
    <p>
        여러 개의 빈 칸은 하나로 취급하며,
        엔터 키 역시 하나의 빈칸으로 처리됨
    </p>
</body>

</html>
