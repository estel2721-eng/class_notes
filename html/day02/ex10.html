<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중첩 리스트</title>
</head>

<body>
    <h3>내가 사는 이유</h3>
    <hr>
    <ul>
        <li>내가 좋아하는 음식
            <ul>
                <li>김치찌개</li>
                <li>된장찌개</li>
                <li>감자탕</li>
                <li>해장국</li>
            </ul>
        </li>
        <li>라면 끓이는 순서
            <ol type="1">
                <li>물을 끓인다.</li>
                <li>라면과 스프를 넣는다.</li>
                <li>파, 계란, 고추를 넣는다.</li>
                <li>맛있게 입으로 넣는다.</li>
            </ol>
        </li>
        <li>여름에는 바다로</li>
        <li>겨울에는 산으로</li>
    </ul>
</body>

</html>
