<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표에 이미지 삽입</title>
    <style>
        table caption {
            margin-bottom: 10px;
        }
        table,
        th,
        td {
            border: 1px solid #005A9C;
        }

        thead,
        tfoot {
            background: #A0E0EF;
        }

        thead {
            text-align: center;
        }
        
        td img {
            width: 120px;
            height: 120px;
            margin: 10px;
        }
        
    </style>
</head>

<body>
    <h3>표에 이미지 삽입</h3>
    <hr>
    <table>
        <caption>좋아하는 과일</caption>
        <thead>
            <tr>
                <td><img src="./img/apple.jpg" alt="사과"></td>
                <td><img src="./img/banana.jpg" alt="바나나"></td>
                <td><img src="./img/strawberry.jpg" alt="딸기"></td>
            </tr>
        </thead>
    </table>
</body>

</html>
