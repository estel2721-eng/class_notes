<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버튼</title>
    <style>
        img {
            width: 50px;
        }
    </style>
</head>

<body>
    <h3>버튼</h3>
    <hr>
    <form action="">
        검색: <input type="text" size="10" value=""> <br>
        <input type="button" value="Q1"> <br>
        <button type="button">Q2</button>
        <hr>
        submit 버튼 <input type="submit" value="전송1"> <br>
        <input type="submit" value="전송2">
        <hr>
        reset 버튼 <input type="reset" value="다시작성">
        <hr>
        이미지 버튼 <input type="image" src="./media/logo.png">
        <button type="button"><img src="./media/logo.png" alt="크롬로고"></button>
    </form>
    <br>
    <form action="">
        돈가스 <input type="checkbox" value="1">
        파스타 <input type="checkbox" value="2">
        감자탕 <input type="checkbox" value="3">
    </form>

    <form action="">
        돈가스 <input type="radio" value="1" name="food">
        파스타 <input type="radio" value="2" name="food">
        감자탕 <input type="radio" value="3" name="food">
    </form>

    <form action="">
        <label for="">점심메뉴</label>
        <select name="" id="">
            <option value="1">돈가스</option>
            <option value="2">파스타</option>
            <option value="3">감자탕</option>
        </select>
    </form>

</body>

</html>
