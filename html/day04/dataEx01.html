<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 목록을 가진 텍스트</title>
</head>

<body>
    <h3>가보고 싶은 곳</h3>
    <hr>
    <form action="">
        가보고 싶은 나라: <input type="text" name="country" list="countries">
        <datalist id="countries">
            <option value="크로아티아"></option>
            <option value="브라질"></option>
            <option value="오스트리아"></option>
            <option value="체코"></option>
        </datalist>
        <br>
        가보고 싶은 곳: <input type="text" list="what">
        <datalist id="what">
            <option value="산"></option>
            <option value="바다"></option>
            <option value="도시"></option>
        </datalist>
    </form>
</body>

</html>
