
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제어시스템</title>
</head>
<body>
    <h3>제어 시스템 - 온도 조절</h3>
    <hr>
    <form action="">
        연속 시간 : (0.0 ~ 10.0)
        <input type="number" min="0.0" max="10.0" step="0.5" name="" id=""> <br>
        온도 조절 : 10&deg; <input type="range" value="20" min="10" max="30" name="" id="" list="temp"> 30&deg;
        
        <datalist id="temp">
            <option value="12" label="Low">10&deg;</option>
            <option value="20" label="Medium"></option>
            <option value="28" label="High">30&deg;</option>
        </datalist>
    </form>
</body>
</html>
