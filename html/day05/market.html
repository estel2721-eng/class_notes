<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글로벌마트</title>
    <style>
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2') format('woff2');
            font-weight: 100;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2') format('woff2');
            font-weight: 200;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }

        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');
            font-weight: 900;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f1f1f1;

            font-family: 'Paperozi';
        }

        #container {
            width: fit-content;
            padding: 20px;
            margin: 60px auto;
            background: #fff;
        }

        #check {
            margin-top: 10px;
            border: 2px solid #eb6530;
            padding: 10px;
        }

        h1 {
            text-align: center;
            background: #eb6530;
            font-size: 2rem;
            color: #fff;
            padding: 5px 0;
        }

        h2 {
            margin: 20px auto;
            background: #f5dfd6;
            color: #eb6530;
            padding: 5px 20px;
            width: fit-content;
        }

        p {
            text-align: center;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="container">
        <img src="./img/top.jpg" id="img" alt="가정용 꿀사과, 흠집이 있고 약간은 못생겼지만 맛과 영양은 그대로 입니다. 질좋은 사과를 저렴하게 즐겨보세요">
        <div id="check">
            <h1>확인 하세요</h1>

            <h2>주문 및 배송</h2>
            <p><span class="accent">오후 2시 이전</span>주문 하시면 당일 배송됩니다. <br> 2시 이후에 주문하시면 다음날 배송됩니다.</p>

            <hr>

            <h2>교환 및 환불 규정</h2>
            <p>제품 불만족시 <span>100%</span> 환불해드립니다. <br> 고객센터로 전화 주세요.</p>

            <hr>

            <h2>고객 센터</h2>
            <p>1588 - 0000
                <br>
                <span class="smalltext">상담시간 : 09:00 ~ 18:00 (토/일, 공휴일 휴무)</span>
            </p>
        </div>
    </div>
</body>

</html>
