<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간 정보를 입력하는 폼</title>
</head>
<body>
    <h3>시간 정보를 입력하는 폼</h3>
    2026년 10월 29일 IT 5기 웹 개발자 과정은 <br>
    아침 9시 30분 시작입니다.
<br><br>
    <form action="">
        <pre>
            month : <input type="month" value="2026-10" name="" id=""> 
            <br>
            week  : <input type="week" value="2026-W44">
            <br>
            date  : <input type="date" value="2026-10-29" name="" id="">
            <br>
            time  : <input type="time" value="09:30" name="" id="">
            <br>
            local : <input type="datetime-local" value="2026-10-29T09:30" name="" id="">
        </pre>
    </form>
</body>
</html>
