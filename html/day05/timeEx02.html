<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 파티 초대</title>
</head>

<body>
    <h3>생일 축하</h3>
    <hr color="violet">
    당신의 생일은 2026년 11월 5일 입니다. <br>
    틀리면 수정하시고 파티 시간과 장소를 입력하세요.
    <hr color="purple">

    <form action="">
        <table>
            <tr>
                <td>생일</td>
                <td><input type="date" value="2026-11-05" name="" id=""></td>
            </tr>
            <tr>
                <td>생일 파티 시간</td>
                <td><input type="time" value="11:30" name="" id=""></td>
            </tr>
            <tr>
                <td>생일 파티 장소</td>
                <td><input type="text" value="글로벌인 강의실"></td>
            </tr>
        </table>
    </form>
</body>

</html>
