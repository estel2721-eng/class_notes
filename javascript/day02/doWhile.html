<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doWhile</title>
</head>

<body>
    <script>
        // 초기화
        var i = 1, sum = 0;
        do {
            sum += i;
            i++; // 증감식
        } while (i <= 10);

        document.write("<h1>1~10까지의 합계 : " + sum + "</h1>");
    </script>
</body>

</html>
