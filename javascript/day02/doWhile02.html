<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do while</title>
</head>

<body>
    <script>
        // 구구단
        var i = 2;
        do {
            var j = 1;
            do {
                document.write("<p>" + i + "X" + j + " = " + (i * j) + "</p>");
                j++;
            }
            while (j < 10);
            i++;
        } while (i<10);
    </script>
</body>

</html>
