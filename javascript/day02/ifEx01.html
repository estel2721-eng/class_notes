<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if 문</title>
</head>
<body>
    <script>

        var myAge = 19;

        if(myAge==19){
            document.write("<h1>"+myAge+"</h1>")
        }
        else if(myAge!=19){
            document.write("<h1>"+myAge+"</h1>")
        }
        else if(myAge>19){
            document.write("<h1>성인입니다.</h1>")
        }
        else if(myAge<=19){
            document.write("<h1>학생입니다.</h1>")
        }
    </script>
</body>
</html>
