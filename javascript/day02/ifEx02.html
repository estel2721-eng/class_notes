<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 두 조건이 모두 참인 경우의 연산자 AND(&&)
        var point = 75;
        if (point > 70 && point <= 80) {
            document.write("<h2>당신의 학점은 C 입니다.</h2>")
        }
        // 두 조건 중 하나라도 참인 경우의 연산자 OR(||)
        if (point <= 70 || point > 80) {
            document.write("<h2>점수 범위를 초과했습니다.</h2>")
        }

    </script>
</body>

</html>
