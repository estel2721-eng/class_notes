<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var is_korean = true;
        
        if(is_korean == true){
            document.write("<h1>한국 사람입니다.<h1/>")
        }

        // 값 자체가 참이므로 조건에 성립
        if(is_korean){
            document.write("<h1>한국 사람입니다.<h1/>")
        }
        
        // 값이 참이 아닌 조건으로 바뀜
        if(!is_korean){
            document.write("<h1>한국 사람입니다.<h1/>")
        }
        


    </script>
</body>
</html>
