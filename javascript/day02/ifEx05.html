<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>
    <script>
        // 85var score = 82;
        // 학점을 저장하는 변수
        var score = parseInt(prompt("점수를 입력", ""));

        var grade = null;

        if (90 < score && score <= 100) {
            grade = 'A';
        } else if (80 < score && score <= 90) {
            grade = 'B';
        } else if (70 < score && score <= 80) {
            grade = 'C';
        }
        else if (60 < score || score <= 70) {
            grade = 'D';
        } else {
            grade = 'F';
        }

        var result = "<h1> 당신은 " + grade + "학점 입니다.</h1>";
        document.write(result);

    </script>
</body>

</html>
