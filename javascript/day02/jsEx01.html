<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 복합 대입 연산자
        var num = 100;

        // 덧셈
        num += 5; // num = num + 5
        document.write("<h2>" + num + "</h2>");

        num -= 5; // num = num +5
        document.write("<h2>" + num + "</h2>");

        num /= 5; // num = num +5
        document.write("<h2>" + num + "</h2>");

        num %= 5; // num = num +5
        document.write("<h2>" + num + "</h2>");

    </script>
</body>

</html>
