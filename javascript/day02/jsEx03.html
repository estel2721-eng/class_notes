<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열</title>
</head>
<body>
    <script>
        // 문자열 연산
        document.write("<h1>문자열 연산</h1>");
        
        var msg1 = "안녕하세요";
        var msg2 = "안녕하세요";
        var msg3 = msg1 + " "+msg2;

        document.write("<h1>"+msg3+"</h1>");

        // 문자열과 숫자값 연산
        var msg = "안녕하세요";
        var num = 1234;
        var result = msg + num;

        document.write("<h2>"+result+"</h2>")
    </script>
</body>
</html>
