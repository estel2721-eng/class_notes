<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        var i = 1, sum = 0;

        while(i<=10){
            sum+=i;
            i++;
        }

        document.write("<h1>1~10까지의 합계 : "+sum+"</h2>")
    </script>
</body>
</html>
