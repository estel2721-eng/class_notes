<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eval</title>
</head>

<body>
    <script>
        // eval 문자열 : 주어진 문자열을 수식으로 변환하여 리턴하는 함수
        var str = "100 + 1";
        document.write("<h2>" + str + "</h2>");

        var result = eval(str);
        document.write("<h2>" + result + "<h1>");

    </script>
</body>

</html>
