<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>

<body>
    <script>
        /*
        Function 함수란
        어떠한 기능을 구현해놓은 집합
        어떤 기능을 구현하거나, 구현되어 있는 기능을 사용하는 것

        함수 정의
        여러개의 문장과 연산을 포함하여 표현하는 식이다.
        function 함수이름(매개변수){
        }

        함수 사용(함수 호출)
        정의해 놓은 함수를 사용하는 것을 의미
        횟수에 제한은 없음
        */

        // 함수 정의 -> 함수 선언
         function sayHello(){
            document.write("<h2>안녕하세요</h2>")
            document.write("<p>감사해요 잘있어요 다시 만나요</p>")
         }

        // 함수 호출
        for(var i=1;i<10;i++){
            sayHello();
        }
    </script>
</body>

</html>
