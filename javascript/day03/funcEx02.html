<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function parameter</title>
</head>

<body>
    <script>
        function func(x) {
            var y = x + 1;
            document.write("<h2>" + y + "<h2>")
        }
        
        func(7);
    </script>
</body>

</html>
