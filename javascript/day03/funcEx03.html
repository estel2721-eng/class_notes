<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function parameter</title>
</head>

<body>
    <script>
        function f(x, y) {
            var z = x+y
            document.write("<h2>" + (x + y) + "</h2>");
            return z; // 계산된 기능을
        }

        // 함수 호출
        // 함수를 호출할 때 매개변수를 같이 전달해 줌
        // 함수에서 계산된 결과를 돌려받아서 i 라고 하는
        var i = f(2,3);
        
        f(2, 3);
    </script>
</body>

</html>
