<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function</title>
</head>

<body>
    <script>
        // 파라미터를 갖는 함수 선언
        function f(x, y) {
            var z = x+y;
            if(z<10){
                return;
            }
            return z;
        }
        
        var a = f(2, 1);
        var b = f(5, 7);
        var c = f(10, 5);
        document.write("<h2>" + a + "</h2>")
        document.write("<h2>" + b + "</h2>")
        document.write("<h2>" + c + "</h2>")
    </script>
</body>

</html>
