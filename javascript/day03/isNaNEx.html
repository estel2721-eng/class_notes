<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>
    <script>
        /*
        isNaN : Not a Number
        */
        var a = Number("a");
        var b = isNaN("a");
        var a_sum = a + 1;
        var a_str = a + "str";

        document.write("<h1> a = " + a + "</h1>");
        document.write("<h1> b = " + b + "</h1>");
        document.write("<h1> a_sum = " + a_sum + "</h1>")
        document.write("<h1>a_str = " + a_str + "</h1>")

        var v1 = "가나다라";
        var v2 = "123456";

        var is_num1 = !isNaN(v1);
        var is_num2 = !isNaN(v2);
        
        if (is_num1) {
            document.write("<h1>" + v1 + " 는 숫자입니다.</h1>")
        } else {
            document.write("<h1>" + v1 + " 는 숫자가 아닙니다.</h1>")
        }

        if (is_num2) {
            document.write("<h1>" + v2 + " 는 숫자입니다.</h1>")
        } else {
            document.write("<h1>" + v2 + " 는 숫자가 아닙니다.</h1>")
        }
    </script>
</body>

</html>
