<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        /* 두개의 파라미터에 대한 덧셈 결과를 리턴해주는 함수를 구현하고
        파라미터로 받은 값이 숫자인지 숫자가 아닌지를 결정해서 함수를 수행한 후
        결과를 리턴해주는 함수 */

        function sumInt(x, y) {
            var isStrX = !isNaN(x);
            var isStrY = !isNaN(y);
            // 둘 중 하나라도 숫자 모양이 아니라면,
            // 실행을 중단하고 메시지를 리턴한다.
            if (!isStrX || !isStrY) {
                return "숫자형태이거나 숫자값이 전달되어야 합니다.";
            }
            
            var result = parseInt(x) + parseInt(y);
            return result;
        }

        // 함수 호출
        var s1 = sumInt("a", 1);
        var s2 = sumInt("1", "2");
        var s3 = sumInt(100, "5.1");
        var s4 = sumInt(-1, "-100");

        document.write("<h2>"+s1+"</h2>");
        document.write("<h2>"+s2+"</h2>");
        document.write("<h2>"+s3+"</h2>");
        document.write("<h2>"+s4+"</h2>");
    </script>
</body>

</html>
