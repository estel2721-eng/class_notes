<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>number</title>
</head>

<body>
    <script>
        // Number(문자열); 문자열의 변수가 숫자모양 
        var value = "100";
        var num1 = Number(value);
        var num2 = parseInt(value);

        // 문자 + 숫자
        var r1 = value + 1;
        document.write("<h2>r1 : " + r1 + "<h1>");

        // 문자 + 숫자
        var r2 = num1 + 1;
        document.write("<h2>r2 : " + num1 + "<h1>");

        // 숫자 + 숫자
        var r3 = num2 + 1;
        document.write("<h2>r3 : " + num2 + "<h1>");
    </script>
</body>

</html>
