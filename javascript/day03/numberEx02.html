<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>number float</title>
</head>
<body>
    <script>

        var value ="";
        var num1 = Number(value);
        var num2 = parseInt(value);

        var r1 = num1 + 1;
        var r2 = num2 + 1;

        document.write("<h2>r1 : "+r1+"</h2>")
        document.write("<h2>r2 : "+r2+"</h2>")
    </script>
</body>
</html>
