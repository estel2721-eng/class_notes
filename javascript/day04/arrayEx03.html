<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>

<body>
    <script>
        /*
            2차원배열
            - 1차원 배열은 행을 중심으로 하며
            - 2차원 배열은 행과 열을 갖는 배열이다.

            2차원 배열의 생성방법 => 2가지

            첫번째 방법
            var myArray = new Array(
                new Array(값1,값2,값3), 
                new Array(값1,값2,값3) 
            );
            
            두번째 방법
            var myArray = [
                [값1, 값2, 값3],
                [값1, 값2, 값3]
            ];

        */

        // 2차원 배열 생성
        var myArray = new Array(
            new Array("가길동", "자바스크립트"),
            new Array("나길동", "웹앱")
        )
        // var myArray = [
        //     ["가길동", "자바스크립트","HTML"],
        //     ["나길동", "웹앱","안드로이드"]
        // ];

        // myArray.length 는 2차원 배열의 줄(행)을 의미함
        for (var i = 0; i < myArray.length; i++) {
            for (var j = 0; j < myArray[i].length; j++) {
                // myArray[i].length 는 i 번째 줄의 칸(열)을 의미함
                document.write("<h1>" + myArray[i][j] + "</h1>");
            }
        }
    </script>
</body>

</html>
