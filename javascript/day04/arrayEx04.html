<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>

<body>
    <script>
        var str = "홍길동, 19세, 남성, 서울";
        // 컴마를 기준으로 문자열을 정리해서, 배열로 리턴

        var data = str.split(",")

        for (var i = 0; i < data.length ; i++) {
            document.write("<h1>"+data[i]+"</h1>")
        }

    </script>
</body>

</html>
