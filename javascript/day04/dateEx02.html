<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>date</title>
</head>

<body>
    <script>
        // 올해는 얼마나 지났는지
        var theDay = new Date(2026, 0, 1);
        var today = new Date();
        var cnt = today.getTime() - theDay.getTime();
        var day = Math.floor(cnt / (24 * 60 * 60 * 1000));

        document.write("<h2>올해는 " + day + " 일 지났습니다.</h2>");
    </script>
</body>

</html>
