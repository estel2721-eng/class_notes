<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>location</title>
</head>

<body>
    <script>
        document.write("<p>문서의 url 주소 : " + location.href + "</p>")
        document.write("<p>호스트 이름과 포트 : " + location.host + "</p>")
        document.write("<p>호스트 컴퓨터 이름 : " + location.hostname + "</p>")
        document.write("<p>앵커 이름 : " + location.hash + "</p>")
        document.write("<p>디렉토리 이하 경로 : " + location.pathname + "</p>")
        document.write("<p>포트번호 : " + location.port + "</p>")
        document.write("<p>프로토콜 : " + location.protocol + "</p>")
        document.write("<p>url 조회부분 : " + location.search + "</p>")
    </script>
    <a href="locationEx.html?a=1&b=2#section1">이 링크로 다시 실행</a>
</body>

</html>
