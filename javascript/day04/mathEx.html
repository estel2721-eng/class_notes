<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>math</title>
</head>
<body>
    <script>
        // math 객체는 최대값, 최소값, 지수, 로그, 삼각함수 등
        // 수학에 관련된 고급함수를 제공한다.

        // 최대값
        var max = Math.max(2,100);
        document.write("<h2>최대값 : "+max+"</h2>");

        // 원주율
        document.write("<h2>원주율 : "+Math.PI+"</h2>");

        var num1 = 13.7146;
        document.write("<h2>소수점 반올림 : "+Math.round(num1)+"</h2>");

        var num2 = 7.2;
        document.write("<h2>소수점 올림 : "+Math.ceil(num2)+"</h2>");

        var num3 = 3.876;
        document.write("<h2>소수점 내림 : "+Math.floor(num3)+"</h2>");

        num = -123;
        document.write("<h2>"+Math.abs(num)+"</h2>");

        document.write("<h2>"+Math.ceil(Math.random()*100)+"</h2>");

    </script>
</body>
</html>
