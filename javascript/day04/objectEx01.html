<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <script>
        // 1. 변수와 함수를 개발자의 판단에 따라 하나의 변수에 저장하는 단위
        // 2. 객체안에 포함된 변수를 => 멤버 변수(속성) 라고 함
        // 3. 객체안에 포함된 힘수를 => 메소드 라고 함

        // 비어있는 객체 생성
        var people = {};
        people.name = 'Jason';
        people.gender = '남자';

        document.write("<h1>"+people.name+"님은 "+people.gender+"입니다. </h1>")
    </script>
</body>
</html>
