<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <script>
        function myFunction(){
            document.write("<h1>안녕히계세요. 여러분!</h1>");
        }

        // 자바스크립트는 함수와 변수가 동급임
        // 따라서 함수의 이름을 변수에 대입할 수 있다. 

        var value = myFunction;

        // 함수가 대입된 변수는 그 자신이 함수처럼 동작함
        value();
        myFunction();
        
    </script>
</body>
</html>
