<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random</title>
</head>

<body>
    <script>
        // 두 수 사이의 난수를 리턴해주는 함수 선언
        function random(n1, n2) {
            return parseInt(Math.random() * (n2 - n1 + 1));
        }

        var num = random(0, 100);
        document.write("<h1> 0~9 사이의 난수 : " + num + "</h1>");

        // 5자리 인증번호
        var auth = "";
        for (var i = 1; i <= 5; i++) {
            auth += random(0, 9);
        }
        
        document.write("<h2> 인증번호 : " + auth + "</h2>");


    </script>
</body>

</html>
