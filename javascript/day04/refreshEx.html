<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>refresh</title>
    <script>
        function random(n1, n2) {
            return parseInt(Math.random() * (n2 - n1 + 1));
        }

        function makeAuth() {
            var authCode = "";
            for (var i = 1; i <= 5; i++) {
                authCode += random(0, 9);
            }

            document.getElementById('auth').innerHTML = authCode;
        }

    </script>
</head>

<body>
    <p>고객님의 인증번호는 <strong id="auth">-----</strong>입니다.</p>

    <input type="button" value="인증번호 받기" onclick="makeAuth()">
</body>

</html>
