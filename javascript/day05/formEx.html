<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-1Thin.woff2') format('woff2');

            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-2ExtraLight.woff2') format('woff2');
            font-weight: 200;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-3Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-4Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-5Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-6SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-8ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-9Black.woff2') format('woff2');
            font-weight: 900;
            font-display: swap;
        }

        body {
            font-family: 'A2z';
        }

        .input_group {
            height: 42px;
            border-bottom: 1px dotted #ccc;
            font: 1em/40px 'A2z', 'Helverica';
        }

        .input_group>label {
            width: 80px;
            display: inline-block;
        }

        /* radio focus */
        /* input[type="radio"]:focus {
            outline: 3px solid red;
            outline-offset: 3px;
        } */
    </style>
</head>

<body>
    <form name="form1" onsubmit="doSubmit(); return false">
        <fieldset>
            <legend>회원가입</legend>
            <div class="input_group first">
                <label>이름</label>
                <input type="text" name="username">
            </div>

            <div class="input_group">
                <label>성별</label>
                <label for=""><input type="radio" name="gender" id="" value="남자">남자</label>
                <label for=""><input type="radio" name="gender" id="" value="여자">여자</label>
            </div>

            <div class="input_group">
                <label>직업</label>
                <select name="job">
                    <option>직업을 선택하세요.</option>
                    <option value="기획자">기획자</option>
                    <option value="웹디자이너">웹디자이너</option>
                    <option value="프론트엔드">웹퍼블리셔</option>
                    <option value="백엔드">프로그래머</option>
                </select>
            </div>
            <div class="input_group">
                <label>취미</label>
                <label for=""><input type="checkbox" name="hobby" value="축구" id="input">축구</label>
                <label for=""><input type="checkbox" name="hobby" value="농구" id="input">농구</label>
                <label for=""><input type="checkbox" name="hobby" value="야구" id="input">야구</label>
            </div>
            <div class="input_group">
                <label>&nbsp;</label>
                <input type="submit" value="회원가입" name="button1">
                <input type="reset" value="초기화" name="button2">
            </div>
        </fieldset>
    </form>
    <script>
        function doSubmit() {
            var frm = document.form1
            // text 요소의 입력 여부 검사
            if (!frm.username.value) {
                alert('이름을 입력해주세요.');
                frm.username.focus();
                return false;
            }
            // 라디오 버튼 입력 여부
            // 항목이 두개 밖에 없으므로, 굳이 반복처리하지 않아도 됨
            if (!frm.gender[0].checked && !frm.gender[1].checked) {
                alert('성별을 선택해주세요.');
                frm.gender[0].focus();
                return false;
            }
            // select 요소에 대한 선택 위치 검사
            if (frm.job.selectedIndex < 1) {
                alert('직업을 선택해주세요.');
                frm.job.focus();
                return false;
            }

            var chk = false;
            for (var i = 0; i < frm.hobby.length; i++) {
                if (frm.hobby[i].checked) {
                    chk = true;
                    break;
                }
            }

            if(!chk){
                alert('취미를 선택해주세요');
                frm.hobby[0].focus();
                return false;
            }

            if(confirm("입력하신 내용이 맞습니까?")){
                frm.submit();
            }
        }

    </script>
</body>

</html>
