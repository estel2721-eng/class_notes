<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thumbnail</title>
    <style>
        /* 목록 정의 초기화 및 여백 설정 */
        .thumbnail {
            margin: 0;
            padding: 0;
            list-style: none;
            width: 120px;
            float: left;
        }

        /* 목록의 각 항목에 대한 크기 및 여백설정 */
        .thumbnail li {
            width: 100px;
            height: 100px;
            padding: 5px 10px;
        }

        .thumbnail img {
            width: 100px;
            height: 100px;
        }

        /* 큰 이미지 영역의 배치와 크기, 여백 설정 */
        .view {
            float: left;
            width: 500;
            height: 320px;
            padding: 5px 0;
        }

        /* 큰 이미지의 크기 설정 */
        .view img {
            width: 500px;
            height: 320px;
        }
    </style>
</head>

<body>
    <ul class="thumbnail">
        <li><a href="#" onclick="setImage(0); return false"><img src="./img/img1.png" alt=""></a></li>
        <li><a href="#" onclick="setImage(1); return false"><img src="./img/img2.png" alt=""></a></li>
        <li><a href="#" onclick="setImage(2); return false"><img src="./img/img3.png" alt=""></a></li>
    </ul>
    <div class="view">
        <img src="./img/img5.png" alt="" id="target">
    </div>
</body>
<script>
    function setImage(index) {
        var img_list = [
            './img/img1.png',
            './img/img2.png',
            './img/img3.png',
        ];
        // 이미지 요소를 객체화 시킴
        var image = document.getElementById('target');
        image.src = img_list[index];
    }

</script>

</html>
