<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Json</title>
    <script>
        var sayHello = {
            "name": "JavaScript",
            "eng": function () {
                var console = document.getElementById("console");
                console.innerHTML = "Hello " + this.name;
                console.style.color = "#ff0000";
            },
            "kor": function () {
                var console = document.getElementById("console");
                console.innerHTML = "안녕 " + this.name;
                console.style.color = "#0000ff";
            },
        }
    </script>
</head>

<body>
    <h1>json 으로 그룹화된 함수 호출</h1>
    <input type="button" value="sayEng" onclick="sayHello.eng()">
    <input type="button" value="sayKor" onclick="sayHello.kor()">

    <h1 id="console"></h1>

</body>

</html>
