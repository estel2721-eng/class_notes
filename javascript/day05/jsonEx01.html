<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>json</title>
    <script>
        // json(JavaScript Object Notation)
        // 경량의 데이터 교환 형식

        // json 표기법
        // var 객체이름 = {이름: 값, 이름: 값, 이름: 값};

        // 객체에 저장된 값에 접근하려면
        // var value = 객체.이름;

        // 새로운 값을 저장하려면
        // 객체이름.이름 = 새로운 값;

        var visual = {
            "name": "홍길동",
            "age": 19,
            "gender": "남자",
            "visual": "멋짐"
        };

        document.write("<h2>" + visual.name + "</h2>");
        document.write("<h2>" + visual.age + "</h2>");
        document.write("<h2>" + visual.gender + "</h2>");
        document.write("<h2>" + visual.visual + "</h2>");
    </script>
</head>

<body>
</body>

</html>
