<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>json</title>
</head>

<body>
    <script>
        var bbs = {
            "title": "Javascript + Jquery 의 완벽 가이드",
            "description": "글로벌인에서 진행하고 있는 IT5기",
            "total": 4,
            "item": [
                { "no": "공지", "subject": "'JavaScript+jQuery' 완벽가이드 강의자료실입니다.", "hit": 3, "date": "2026.11.19" },
                { "no": 3, "subject": "1일차 강의자료실입니다.", "hit": 6, "date": "2026.11.18" },
                { "no": 2, "subject": "2일차 강의자료실입니다.", "hit": 5, "date": "2026.11.17" },
                { "no": 1, "subject": "3일차 강의자료실입니다.", "hit": 4, "date": "2026.11.16" }
            ]
        }

        // bbs 안의 각 독립된 값들에 대한 출력 HTML 생성
        var html = "<h1>" + bbs.title + "</h1>";
        html += "<p>" + bbs.description + "</p>";
        html += "<p> 총 게시글 수 : " + bbs.total + "</p>";
        html += "<ul>";

        for (var i = 0; i < bbs.item.length; i++) {
            var item = bbs.item[i];
            html += "<li>(" + item.no + ") " + item.subject + "(조회수: " + item.hit + " / 날짜 : " + item.date + ")</li>";
        }
        html += "</ul>";

        document.write(html);
    </script>
</body>

</html>
