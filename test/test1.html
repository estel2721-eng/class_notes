<body>
    <script>
        function solution(array) {
            var answer = 0;
            var count;
            var maxCount = 0;;
            var i, j

            for (i = 0; i < array.length; i++) {
                count = 0;
                for (j = 0; array.length; j++) {
                    if (array[i] == array[j]) {
                        count++;
                    }
                }
                if (count > maxCount) {
                    maxCount = count;
                }
            }
            return maxCount;
        }
        console.log(maxCount);
    </script>
